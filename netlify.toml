[build]
  command = "npm run check:content && npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"

# L'ancien site du concours reste consultable en archive (à brancher sur son adresse d'archive).
[[redirects]]
  from = "/concours/*"
  to = "/archive-concours/:splat"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
